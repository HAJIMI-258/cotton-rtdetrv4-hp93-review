__include__: ['rtv4_hgnetv2_m_cotton_balanced_v6_768.yml']

# v7_weakcls_ft_768
# Fine-tune the 21-class v6 AP50-best checkpoint. This is model-training optimization,
# not TTA/WBF or output-only postprocess.
# Launch:
#   python -u train.py -c configs/cotton/rtv4_hgnetv2_m_cotton_v7_weakcls_ft_768.yml -t outputs/rtv4_hgnetv2_m_cotton_balanced_v6_768/best_ap50.pth -d cuda --seed 0 --use-amp

output_dir: ./outputs/rtv4_hgnetv2_m_cotton_v7_weakcls_ft_768
summary_dir: ./outputs/rtv4_hgnetv2_m_cotton_v7_weakcls_ft_768/tensorboard
num_classes: 21
remap_mscoco_category: False
best_select_metric: ap50
best_ap50_checkpoint_name: best_ap50_v7_weakcls_ft.pth
best_meta_name: best_ap50_v7_weakcls_ft.json
early_stopping_patience: 14

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

HybridEncoder:
  # Keep v6 3-level detector; avoid failed P2/all-module routes.
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  depth_mult: 0.67
  expansion: 0.5
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  act: 'silu'
  distill_teacher_dim: 768
  ifpn_upsample_mode: bilinear
  edge_enhance: False
  prewitt_franklin_enhance: True
  prewitt_franklin_alpha: 0.10
  prewitt_franklin_local_refine: True
  prewitt_franklin_local_kernel_size: 7
  prewitt_franklin_edge_consistency: False
  edge_threshold_ratio: 0.2
  small_lesion_enhance: True
  small_lesion_alpha: 0.12
  output_refine: True
  output_refine_alpha: 0.06
  carafe_upsample: True
  carafe_compressed_channels: 32
  carafe_kernel_size: 3
  bifpn_fusion: True
  coord_attention_exact: True
  coordinate_attention_alpha: 0.06
  eca_attention: True
  eca_alpha: 0.04
  cbam_attention: False
  lsk_attention: False
  fasternet_pconv: False
  repvgg_enhance: False
  gather_distribute: False
  safe_module_init_scale: 0.008
  safe_module_trainable_scale: True
  safe_module_max_scale: 0.05

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 300

accumulation_steps: 2
epoches: 36
flat_epoch: 8
no_aug_epoch: 10
warmup_iter: 300
checkpoint_freq: 1
print_freq: 50
use_amp: True
use_ema: True
sync_bn: False
find_unused_parameters: False
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params:
    - {params: '.*(?:enc_score_head|dec_score_head|denoising_class_embed).*', lr: 0.00008, weight_decay: 0.}
    - {params: '.*(?:prewitt_franklin_scale|small_lesion_scale|carafe_scales|bifpn_top_down_scales|bifpn_bottom_up_scales|output_refine_scales|coordinate_attention_exact_scales|eca_attention_scales).*', lr: 0.00005, weight_decay: 0.}
    - {params: '^(?=.*backbone)(?!.*norm|bn).*$', lr: 0.000006}
    - {params: '^(?=.*backbone)(?=.*norm|bn).*$', lr: 0.000006, weight_decay: 0.}
    - {params: '^(?!.*(?:enc_score_head|dec_score_head|denoising_class_embed))(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.}
  lr: 0.000035
  betas: [0.9, 0.999]
  weight_decay: 0.0001

RTv4Criterion:
  # No BoxFit/AP50-margin/MPDIoU/Alpha-IoU; previous runs showed those hurt.
  weight_dict: {loss_mal: 1.15, loss_bbox: 4.0, loss_giou: 1.6, loss_nwd: 0.18, loss_fgl: 0.10, loss_ddf: 1.0, loss_distill: 0.8}
  losses: ['mal', 'boxes', 'local', 'distill']
  gamma: 1.5
  reg_max: 32
  nwd_normalizer: 1.0
  nwd_eps: 1.0e-7
  hdps_class_union: False
  # 21-class ids: 0 aphid, 1 mealy_bug, 2 red_bug, 4 american_bollworm,
  # 5 pink_bollworm, 6 army_worm, 7 thrips, 8 whitefly, 14 powdery_mildew, 18 boll_rot.
  class_loss_weights: {0: 1.18, 1: 1.25, 2: 1.18, 4: 1.12, 5: 1.22, 6: 1.10, 7: 1.10, 8: 1.35, 14: 1.18, 18: 1.12}
  distill_adaptive_params:
    enabled: True
    foreground_focus: True
    fg_weight: 1.0
    bg_weight: 0.015
    box_scale: 1.8
    min_fg_pixels: 4
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2.6, cost_bbox: 4.0, cost_giou: 1.6}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/train
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.12}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.12}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 768]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [0, 18, 26]
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.0
  shuffle: True
  total_batch_size: 8
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 768
    base_size_repeat: 3
    mixup_prob: 0.0
    mixup_epochs: [0, 0]
    stop_epoch: 100000
    ema_restart_decay: 0.9998

val_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/val
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_val.json
    transforms:
      ops:
        - {type: Resize, size: [768, 768]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 16
  num_workers: 4
  drop_last: False
