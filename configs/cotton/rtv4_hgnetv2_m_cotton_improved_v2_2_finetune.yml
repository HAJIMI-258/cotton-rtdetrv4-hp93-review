__include__: [
  'rtv4_hgnetv2_m_cotton_balanced_v6_768.yml'
]

# improved_v2_2_finetune
# Fine-tune from improved v1 AP50-best checkpoint, do not train from scratch.
# Launch with:
#   python -u train.py -c configs/cotton/rtv4_hgnetv2_m_cotton_improved_v2_2_finetune.yml -t outputs/rtv4_hgnetv2_m_cotton_balanced_v6_768/best_ap50.pth -d cuda --seed 0 --use-amp

output_dir: ./outputs/improved_v2_2_finetune
summary_dir: ./outputs/improved_v2_2_finetune/tensorboard

# Current cleaned balanced dataset is 21 classes, not core9.
# Missing in the current 21-class annotations: yellowish_leaf, damaged_cotton_boll.
num_classes: 21
remap_mscoco_category: False

best_select_metric: ap50_hard_tie_v2_2
hard_class_names: ['leaf_reddening', 'yellowish_leaf', 'damaged_cotton_boll']
hard_class_tie_threshold: 0.003
best_ap50_checkpoint_name: best_ap50_v2_2.pth
best_hardclass_checkpoint_name: best_hardclass_v2_2.pth
best_meta_name: best_ap50_v2_2.json
early_stopping_patience: 10

HybridEncoder:
  # Keep the v1 high-probability structure, but make edge/small-lesion modules explicit.
  prewitt_franklin_enhance: True
  prewitt_franklin_alpha: 0.12
  prewitt_franklin_local_refine: True
  prewitt_franklin_local_kernel_size: 7
  prewitt_franklin_edge_consistency: True

  small_lesion_enhance: True
  small_lesion_alpha: 0.15
  output_refine: True
  output_refine_alpha: 0.08

  carafe_upsample: True
  bifpn_fusion: True
  gather_distribute: True
  gather_distribute_alpha: 0.08

  # Keep non-core attention conservative for this fine-tune.
  coord_attention_exact: True
  coordinate_attention_alpha: 0.04
  eca_attention: False
  cbam_attention: False
  lsk_attention: False
  fasternet_pconv: False
  repvgg_enhance: False

  # Fine-tune gates are trainable but clamped tightly to avoid destabilizing v1 best.
  safe_module_init_scale: 0.005
  safe_module_trainable_scale: True
  safe_module_max_scale: 0.02

# Keep 768 input and the stable batch recipe from improved v1.
accumulation_steps: 2
epoches: 30
flat_epoch: 6
no_aug_epoch: 10
warmup_iter: 300
checkpoint_freq: 1
print_freq: 50
use_amp: True
use_ema: True
sync_bn: False
find_unused_parameters: False
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params:
    -
      params: '.*(?:prewitt_franklin_scale|small_lesion_scale|carafe_scales|bifpn_top_down_scales|bifpn_bottom_up_scales|gather_distribute_scale|output_refine_scales).*'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

RTv4Criterion:
  weight_dict: {loss_mal: 1.1, loss_bbox: 4, loss_giou: 1.5, loss_nwd: 0.30, loss_fgl: 0.10, loss_ddf: 1.0, loss_distill: 1.0, loss_edge_consistency: 0.02}
  losses: ['mal', 'boxes', 'local', 'distill', 'edge_consistency']
  gamma: 1.5
  reg_max: 32
  nwd_normalizer: 1.0
  nwd_eps: 1.0e-7
  hdps_class_union: False
  # Current 21-class ids: leaf_reddening=16. The other two requested hard
  # classes are absent from the active 21-class dataset and must be added here
  # by id if restored later.
  class_loss_weights: {16: 1.4}
  distill_adaptive_params:
    enabled: True
    foreground_focus: True
    fg_weight: 1.0
    bg_weight: 0.01
    box_scale: 2.0
    min_fg_pixels: 4
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2.5, cost_bbox: 4, cost_giou: 1.5}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/train
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_train.json
    transforms:
      ops:
        - {type: HardClassCopyPaste, target_category_names: ['leaf_reddening', 'yellowish_leaf', 'damaged_cotton_boll'], probability: 0.25, max_paste: 2, max_trials: 25, context_ratio: 0.18, scale_range: [0.90, 1.10], max_patch_ratio: 0.45, max_overlap_iou: 0.35, min_box_size: 4, max_epoch: 20}
        - {type: RandomPhotometricDistort, p: 0.10}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.10}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 768]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [0, 20, 25]
        ops: ['HardClassCopyPaste', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.0
  shuffle: True
  total_batch_size: 8
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 768
    base_size_repeat: 3
    mixup_prob: 0.0
    mixup_epochs: [0, 0]
    stop_epoch: 100000
    ema_restart_decay: 0.9998

val_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/val
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_val.json
    transforms:
      ops:
        - {type: Resize, size: [768, 768]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 16
  num_workers: 4
  drop_last: False
