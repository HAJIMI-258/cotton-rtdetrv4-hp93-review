__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
  '../base/rtv4.yml'
]

# Core300 17-class clean baseline.
# Same dataset, backbone size, resolution, batch and schedule as the improved route,
# but without added feature modules, NWD or teacher distillation.
output_dir: ./outputs/rtv4_hgnetv2_m_cotton_core300_17cls_baseline
summary_dir: ./outputs/rtv4_hgnetv2_m_cotton_core300_17cls_baseline/tensorboard

num_classes: 17
remap_mscoco_category: False

eval_spatial_size: [768, 768]

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  depth_mult: 0.67
  expansion: 0.5
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  act: 'silu'
  distill_teacher_dim: 768

  ifpn_upsample_mode: bilinear
  edge_enhance: False
  prewitt_franklin_enhance: False
  prewitt_franklin_alpha: 0.0
  edge_threshold_ratio: 0.2

  small_lesion_enhance: False
  small_lesion_alpha: 0.0
  output_refine: False
  output_refine_alpha: 0.0

  carafe_upsample: False
  carafe_compressed_channels: 32
  carafe_kernel_size: 3
  bifpn_fusion: False

  coord_attention_exact: False
  coordinate_attention_alpha: 0.0
  eca_attention: False
  eca_alpha: 0.0
  cbam_attention: False
  lsk_attention: False
  fasternet_pconv: False
  repvgg_enhance: False
  gather_distribute: False

  safe_module_init_scale: 0.0
  safe_module_trainable_scale: False
  safe_module_max_scale: 0.0

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 300

accumulation_steps: 2

epoches: 80
flat_epoch: 40
no_aug_epoch: 20
checkpoint_freq: 1
print_freq: 50
use_amp: True
use_ema: True
sync_bn: False
find_unused_parameters: False
clip_max_norm: 0.1

ema:
  type: ModelEMA
  decay: 0.9998
  warmups: 1000
  start: 0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00003
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00003
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00014
  betas: [0.9, 0.999]
  weight_decay: 0.0001

RTv4Criterion:
  weight_dict: {loss_mal: 1.0, loss_bbox: 5.0, loss_giou: 2.0, loss_fgl: 0.10, loss_ddf: 1.0}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  reg_max: 32
  hdps_class_union: False
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2.0, cost_bbox: 5.0, cost_giou: 2.0}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  dataset:
    img_folder: ./data/cotton_core300_17cls/images/train
    ann_file: ./data/cotton_core300_17cls/annotations/instances_train.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 384, rotation_range: 8, translation_range: [0.08, 0.08], scaling_range: [0.6, 1.4], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.3}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.3}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 768]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [3, 18, 28]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.25
  shuffle: True
  total_batch_size: 8
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 768
    base_size_repeat: 3
    mixup_prob: 0.1
    mixup_epochs: [3, 18]
    stop_epoch: 28
    ema_restart_decay: 0.9998

val_dataloader:
  dataset:
    img_folder: ./data/cotton_core300_17cls/images/val
    ann_file: ./data/cotton_core300_17cls/annotations/instances_val.json
    transforms:
      ops:
        - {type: Resize, size: [768, 768]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 16
  num_workers: 4
  drop_last: False
