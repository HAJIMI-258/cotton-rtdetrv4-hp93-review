# RT-DETRv4 Cotton from-scratch v9: AP50 BoxFit
# Requires boxfit_ap50_patch.diff applied to rtv4_criterion.py and postprocessor.py.
#
# Purpose:
#   Optimize predicted boxes to cross AP50 by adding matched-box corner-distance,
#   power-IoU, and AP50-margin losses. This is not another feature-module stack.
#
# Launch:
#   python -u train.py -c configs/cotton/rtv4_hgnetv2_m_cotton_fromscratch_v9_896_boxfit.yml -d cuda --seed 0 --use-amp

__include__: [
  'rtv4_hgnetv2_m_cotton_balanced_v6_768.yml'
]

output_dir: ./outputs/rtv4_hgnetv2_m_cotton_fromscratch_v9_896_boxfit
summary_dir: ./outputs/rtv4_hgnetv2_m_cotton_fromscratch_v9_896_boxfit/tensorboard

num_classes: 21
remap_mscoco_category: False
eval_spatial_size: [896, 896]

# Pure AP50 best. No hard-class tie overwrite.
best_select_metric: ap50_hard_tie_v2_2
hard_class_names: []
hard_class_tie_threshold: 0.0
best_ap50_checkpoint_name: best_ap50_v9_896_boxfit.pth
best_hardclass_checkpoint_name: null
best_meta_name: best_ap50_v9_896_boxfit.json
early_stopping_patience: null

PostProcessor:
  num_top_queries: 300
  # AP evaluation is rank-based, so keep threshold low. NMS only removes obvious duplicates.
  score_threshold: 0.001
  nms_iou_threshold: 0.75

HybridEncoder:
  # Keep v6 high-probability stack, explicitly pinned.
  ifpn_upsample_mode: bilinear
  edge_enhance: False
  edge_threshold_ratio: 0.2

  prewitt_franklin_enhance: True
  prewitt_franklin_alpha: 0.12
  prewitt_franklin_local_refine: True
  prewitt_franklin_local_kernel_size: 7
  prewitt_franklin_edge_consistency: False

  small_lesion_enhance: True
  small_lesion_alpha: 0.12
  output_refine: True
  output_refine_alpha: 0.08

  carafe_upsample: True
  carafe_compressed_channels: 32
  carafe_kernel_size: 3
  bifpn_fusion: True

  coord_attention_exact: True
  coordinate_attention_alpha: 0.08
  eca_attention: True
  eca_alpha: 0.06

  cbam_attention: False
  lsk_attention: False
  fasternet_pconv: False
  repvgg_enhance: False
  gather_distribute: False

  safe_module_init_scale: 0.03
  safe_module_trainable_scale: True
  safe_module_max_scale: 0.15

# 3090-safe 896 training.
accumulation_steps: 4
epoches: 120
flat_epoch: 70
no_aug_epoch: 30
warmup_iter: 2000
checkpoint_freq: 1
print_freq: 50
use_amp: True
use_ema: True
sync_bn: False
find_unused_parameters: False
clip_max_norm: 0.1

ema:
  type: ModelEMA
  decay: 0.9998
  warmups: 1000
  start: 0

optimizer:
  type: AdamW
  params:
    -
      params: '.*(?:prewitt_franklin_scale|small_lesion_scale|carafe_scales|bifpn_top_down_scales|bifpn_bottom_up_scales|output_refine_scales|coordinate_attention_exact_scales|eca_attention_scales).*'
      lr: 0.00014
      weight_decay: 0.
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00003
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00003
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00014
  betas: [0.9, 0.999]
  weight_decay: 0.0001

RTv4Criterion:
  # Localization-heavy AP50 recipe.
  # Existing loss_boxes path will emit loss_mpdiou/loss_alpha_iou/loss_ap50_margin after the patch.
  weight_dict: {loss_mal: 1.0, loss_bbox: 5.0, loss_giou: 2.0, loss_nwd: 0.35, loss_mpdiou: 0.35, loss_alpha_iou: 0.12, loss_ap50_margin: 0.20, loss_fgl: 0.10, loss_ddf: 1.0, loss_distill: 1.2}
  losses: ['mal', 'boxes', 'local', 'distill']
  alpha: 0.2
  gamma: 1.3
  reg_max: 32

  # Current implementation uses normalized boxes, so 1.0 makes NWD weak.
  # 0.25 makes small normalized center/size errors matter more.
  nwd_normalizer: 0.25
  nwd_eps: 1.0e-7

  box_fit_alpha: 2.0
  ap50_iou_target: 0.56
  ap50_hinge_low: 0.25
  mpdiou_eps: 1.0e-7

  hdps_class_union: False
  distill_adaptive_params:
    enabled: True
    foreground_focus: True
    fg_weight: 2.0
    bg_weight: 0.01
    box_scale: 2.2
    min_fg_pixels: 6
  matcher:
    type: HungarianMatcher
    # More box-biased than v6; close to the base D-FINE localization cost.
    weight_dict: {cost_class: 2.0, cost_bbox: 5.0, cost_giou: 2.0}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/train
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_train.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 448, rotation_range: 8, translation_range: [0.08, 0.08], scaling_range: [0.6, 1.4], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.25}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.25}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [896, 896]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [4, 22, 36]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.25
  shuffle: True
  total_batch_size: 4
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 896
    base_size_repeat: null
    mixup_prob: 0.10
    mixup_epochs: [4, 22]
    stop_epoch: 36
    ema_restart_decay: 0.9998

val_dataloader:
  dataset:
    img_folder: ./data/cotton_rtdetr_dataset_balanced_stratified/images/val
    ann_file: ./data/cotton_coco_balanced_stratified/annotations/instances_val.json
    transforms:
      ops:
        - {type: Resize, size: [896, 896]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 8
  num_workers: 4
  drop_last: False
